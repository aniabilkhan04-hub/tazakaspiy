# Netlify раздаёт только статический сайт из public/.
# Flask-сервер и Telegram-бот на Netlify запустить нельзя — они должны работать
# на другом хостинге (см. README, раздел «Хостинг»).
#
# Бэкенд (`python run.py`) работает на Render: https://tazakaspiy-t8cj.onrender.com

[build]
  publish = "public"

# Запросы к API и фото проксируются на бэкенд — фронтенд при этом не меняется
[[redirects]]
  from = "/api/*"
  to = "https://tazakaspiy-t8cj.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://tazakaspiy-t8cj.onrender.com/uploads/:splat"
  status = 200
  force = true
